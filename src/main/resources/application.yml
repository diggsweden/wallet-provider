server:
  port: 8080
spring:
  application:
    name: wallet-provider
  docker:
    compose:
      enabled: false

properties:
  logging-filter:
    enabled: true
    max-payload-length: 10000
    exclude-path:
      exact-match: >
        /
      contains: >
        /actuator, /swagger, /v3/api-docs, .html, .png, .gif, .js, .yaml
    sensitive-data-mask:
      mask-value: "***MASKED***"
      # enter values in lower case
      headers: >
        authorization, x-api-key, api-key, apikey, x-auth-token, cookie, set-cookie, x-csrf-token
    # WARNING: Body masking only masks header values by name.
    # JWTs and sensitive data in request/response bodies will NOT be masked.
    # For production security, keep log-body disabled.
    log-body: false

# Management and Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true

wua:
  keystore:
    location: ${WUA_KEYSTORE_PATH}
    password: ${WUA_KEYSTORE_PASSWORD}
    alias: ${WUA_KEYSTORE_ALIAS}
    type: PKCS12
    validity-hours: 24
    status: '${WALLET_PROVIDER_WUA_STATUS:{"status_list": {"idx": 412,"uri": "https://revocation_url/statuslists/1"}}}'

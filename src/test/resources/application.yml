spring:
  application:
    name: wallet-provider

wia:
  status: '{"status_list": {"idx": 412,"uri": "https://example.org/wia-statuslists/1"}}'
  status-maintenance-days: 365
  validity-minutes: 60
  client-id: digg-wallet
  wallet-name: Digg Wallet
  wallet-version: 0.0.1
  wallet-link: https://www.digg.se
  wallet-solution-certification-information: UNCERTIFIED

wua:
  keystore:
    location: classpath:certificates/wallet-provider.p12
    password: secret
    alias: wallet-provider
    type: PKCS12
    issuer: "Digg"
    validity-hours: 24
    eudi-wallet-info: >
      {
        "general_info": {
          "wallet_provider_name": "Digg",
          "wallet_solution_id": "Diggidigg-id",
          "wallet_solution_version": "0.0.1",
          "wallet_solution_certification_information": "UNCERTIFIED"
        },
        "wscd_info": {
          "wscd_certification_information": "UNCERTIFIED"
        }
      }
    status: '${WALLET_PROVIDER_WUA_STATUS:{"status_list": {"idx": 412,"uri": "https://revocation_url/statuslists/1"}}}'

# Configuration for openapi-diff backward compatibility checks.
# Set individual rules to false if you intentionally introduce breaking changes.
#
# Examples:
# incompatible:
#   request:
#     required:
#       increased: false
#   response:
#     enum:
#       increased: false
#   openapi:
#     endpoints:
#       decreased: false

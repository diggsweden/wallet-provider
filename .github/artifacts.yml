# Artifacts Configuration for wallet-attestation-issuer
# Defines what to build and where to publish

artifacts:
  - name: wallet-attestation-issuer
    project-type: maven
    working-directory: .
    build-type: application
    config:
      java-version: 25

containers:
  - name: wallet-attestation-issuer
    from: [wallet-attestation-issuer]
    container-file: Containerfile
    context: .
    platforms: linux/amd64,linux/arm64
    registry: ghcr.io

publishers:
  - type: github-packages
    artifacts: [wallet-attestation-issuer]
